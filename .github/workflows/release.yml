name: release

# Native installers can only be built on the system they are for, so each one gets its own runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
          - os: windows-latest
            task: packageMsi
          - os: macos-latest
            task: packageDmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew :app:${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: foxhg-${{ matrix.os }}
          path: app/build/compose/binaries/main/*/*
