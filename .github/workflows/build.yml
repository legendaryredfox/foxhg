name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display for the UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # No ROM in CI: the tests that need one skip with a notice.
      - name: Build and test
        run: env -u XDG_CURRENT_DESKTOP -u DESKTOP_SESSION -u GNOME_DESKTOP_SESSION_ID xvfb-run -a ./gradlew build
